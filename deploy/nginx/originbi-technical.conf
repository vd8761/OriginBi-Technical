# nginx site for OriginBi Technical — the backend API edge.
#
# Install with:
#   sudo cp deploy/nginx/originbi-technical.conf /etc/nginx/sites-available/originbi-technical
#   sudo ln -s /etc/nginx/sites-available/originbi-technical /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d evaluation-api.originbi.com
#
# After certbot runs, delete the server-level `if ($host = ...) { return 301; }`
# block it prepends to the :80 server. It executes in the rewrite phase, before
# location matching, so it shadows the ACME challenge location below and makes
# a webroot renewal impossible. The explicit `location /` already redirects.
#
# OriginBi Technical — backend API edge.
# The Next.js frontend is on Vercel (evaluation.originbi.com) and calls this
# host directly, so every route here is CORS-credentialed cross-origin traffic.

# ── Upstreams ───────────────────────────────────────────────────────────────
# One server each today: the droplet is 1 vCPU, so a second replica of the same
# service competes for the same core rather than adding throughput. The blocks
# exist so scaling out is a one-line change — add `server 127.0.0.1:PORT;` and
# reload. `keepalive` is what actually buys throughput at this size: it stops
# nginx opening a fresh TCP connection per proxied request.
upstream exam_engine {
    least_conn;
    server 127.0.0.1:8088 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

upstream assessment_service {
    least_conn;
    server 127.0.0.1:5000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

upstream auth_service {
    least_conn;
    server 127.0.0.1:4002 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# Per-IP limiting. 100 students on a shared campus NAT can share one IP, so
# this is deliberately loose — it is a floodgate, not a fairness policy.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=apiconn:10m;

server {

    listen 80;
    listen [::]:80;
    server_name evaluation-api.originbi.com;

    # certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }


}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evaluation-api.originbi.com;

    # certbot fills these in.
    ssl_certificate /etc/letsencrypt/live/evaluation-api.originbi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/evaluation-api.originbi.com/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # An exam submit carrying a long answer body must not be truncated.
    client_max_body_size 12m;
    client_body_timeout 30s;

    limit_conn apiconn 100;

    access_log /var/log/nginx/originbi-access.log;
    error_log  /var/log/nginx/originbi-error.log warn;

    # Shared proxy behaviour. X-Forwarded-For matters: both Node services call
    # set('trust proxy', 1), and without a real client IP their per-IP
    # throttles treat the entire internet as one client.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # A timed exam should fail fast and let the client retry, not hang.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    # Never let a stale answer be served for exam state.
    proxy_buffering off;

    # ── Routing: mirrors frontend/next.config.ts rewrites ──────────────────
    location /v1/          { limit_req zone=api burst=60 nodelay; proxy_pass http://exam_engine; }
    location /api/         { limit_req zone=api burst=60 nodelay; proxy_pass http://assessment_service; }
    location /auth-api/    { limit_req zone=api burst=20 nodelay; proxy_pass http://auth_service/; }
    location /student-api/ { limit_req zone=api burst=20 nodelay; proxy_pass http://auth_service/; }

    # Health probes, unthrottled so monitoring never trips the limiter.
    location = /readyz  { proxy_pass http://exam_engine; access_log off; }
    location = /healthz { proxy_pass http://exam_engine; access_log off; }
    location = /nginx-health { return 200 "ok\n"; add_header Content-Type text/plain; access_log off; }

    location / { return 404; }

}
